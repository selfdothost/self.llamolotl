[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:llama-server]
command=/app/llama-server-wrapper.sh
environment=LD_LIBRARY_PATH="/app/lib:%(ENV_LD_LIBRARY_PATH)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=10

[program:training-api]
; FastAPI server for controlling training jobs (HF Trainer + DeepSpeed + PEFT).
; Load as the `api` package (api/main.py uses relative imports: from .state / .routers),
; so app-dir is /workspace/training (its parent) and the target is api.main:app.
command=/opt/venv/bin/uvicorn api.main:app --app-dir /workspace/training --host 0.0.0.0 --port 8093 --log-level info
environment=PATH="/opt/venv/bin:%(ENV_PATH)s",PYTHONUNBUFFERED="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=20

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
